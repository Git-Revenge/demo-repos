name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag, the script and the changelog agree
        run: |
          tag=${GITHUB_REF_NAME#v}
          script=$(bash demo-repo.sh --version | cut -d' ' -f2)
          logged=$(grep -m 1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "tag $tag, demo-repo.sh $script, CHANGELOG.md $logged"
          [ "$tag" = "$script" ] && [ "$tag" = "$logged" ] || { echo "they disagree"; exit 1; }
          git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ] || { echo "the tag must be annotated: releases are immutable"; exit 1; }
      - name: Build
        run: |
          bash demo-repo.sh "$RUNNER_TEMP/out"
          bash demo-repo-git3.sh "$RUNNER_TEMP/out"
      - name: Notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\nBuild it:\n\n```sh\ncurl -fsSL https://github.com/Git-Revenge/demo-repos/releases/download/%s/demo-repo.sh -o demo-repo.sh\nbash demo-repo.sh ~/gitrevenge-practice\n```\n' "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum demo-repo.sh demo-repo-git3.sh > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" demo-repo.sh demo-repo-git3.sh SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
