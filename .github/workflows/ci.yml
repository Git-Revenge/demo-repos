name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gawk, os: ubuntu-24.04, awk: gawk, bash: bash }
          - { name: linux-mawk, os: ubuntu-24.04, awk: mawk, bash: bash }
          # macOS's own awk (the one true awk) and its bash 3.2.
          - { name: macos, os: macos-latest, awk: /usr/bin/awk, bash: /bin/bash }
          - { name: windows, os: windows-latest, awk: gawk, bash: bash }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install awks
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq gawk mawk >/dev/null
      - name: Use ${{ matrix.awk }} as awk
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v ${{ matrix.awk }})" "$RUNNER_TEMP/bin/awk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          git --version
          awk --version 2>/dev/null | head -n 1 || awk -W version 2>&1 | head -n 1 || true
          ${{ matrix.bash }} --version | head -n 1
      - name: Build Tidewater
        run: ${{ matrix.bash }} demo-repo.sh "$RUNNER_TEMP/out"
      - name: Build Tidewater for Git 3.0
        run: ${{ matrix.bash }} demo-repo-git3.sh "$RUNNER_TEMP/out"
      - name: Check what was built
        run: |
          out="$RUNNER_TEMP/out"
          for r in tidewater tidewater-git3; do
            commits=$(git -C "$out/$r" rev-list --count --all)
            tags=$(git -C "$out/$r" tag | wc -l | tr -d ' ')
            echo "$r: $commits commits, $tags tags, $(git -C "$out/$r" rev-parse --show-object-format --show-ref-format | tr '\n' ' ')"
            [ "$commits" -gt 1000 ] && [ "$tags" -ge 20 ] || { echo "too little history"; exit 1; }
          done
          [ "$(git -C "$out/tidewater-git3" rev-parse --show-object-format)" = sha256 ]
          [ "$(git -C "$out/tidewater-git3" rev-parse --show-ref-format)" = reftable ]
          [ "$(git -C "$out/tidewater" status --porcelain | wc -l | tr -d ' ')" = 2 ]
          git -C "$out/tidewater" stash list | grep -q "Contributing section"
      - name: Fingerprint every ref
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p fingerprints
          for r in tidewater tidewater-git3; do
            git -C "$out/$r" for-each-ref --format='%(refname) %(objectname)' | sort | git hash-object --stdin > "fingerprints/$r"
            echo "$r: $(cat "fingerprints/$r")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-${{ matrix.name }}
          path: fingerprints/

  # Every awk, bash and OS must build the very same commits.
  same:
    name: Same everywhere
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fingerprints-*
      - name: Compare
        run: |
          for r in tidewater tidewater-git3; do
            echo "$r:"
            for f in fingerprints-*/"$r"; do echo "  $(cat "$f")  ${f%%/*}"; done
            [ "$(cat fingerprints-*/"$r" | sort -u | wc -l)" = 1 ] || { echo "builds differ"; exit 1; }
          done
